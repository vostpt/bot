<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BusyBee · Worker Status</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ffc14d'/%3E%3Cpath d='M32 13l4 15 15 4-15 4-4 15-4-15-15-4 15-4z' fill='%23201400'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="bee" aria-hidden="true">✦</span>
      <div>
        <h1>BusyBee</h1>
        <p class="subtitle">Pane worker mission control</p>
      </div>
    </div>
    <div class="header-actions">
      <span id="pane-chip" class="chip chip-muted">connecting…</span>
      <button id="refresh" class="refresh" type="button" title="Refresh now">↻ Refresh</button>
    </div>
  </header>

  <main>
    <section class="hero panel">
      <div class="hero-main">
        <div class="eyebrow">Overall progress</div>
        <div class="hero-number"><span id="overall-pct">0</span><small>%</small></div>
        <div class="bar bar-large"><div id="overall-bar" class="bar-fill"></div></div>
        <div id="overall-meta" class="muted">Waiting for worker data…</div>
      </div>
      <div class="hero-side">
        <div class="stat"><span id="stat-completed">0</span><small>done</small></div>
        <div class="stat"><span id="stat-active">0</span><small>active</small></div>
        <div class="stat"><span id="stat-pending">0</span><small>queued</small></div>
        <div class="stat"><span id="stat-failed">0</span><small>failed</small></div>
      </div>
    </section>

    <section class="current-step panel">
      <div class="eyebrow">Pane's current step</div>
      <p id="current-step">—</p>
    </section>

    <section>
      <div class="section-heading">
        <h2>Workers</h2>
        <span id="workflow-id" class="muted"></span>
      </div>
      <div id="workers" class="workers"></div>
    </section>

    <footer class="muted">
      <span id="updated">—</span>
      <span>Live from the local BusyBee pane session · refreshes every 5s</span>
    </footer>
  </main>

  <script src="/app.js"></script>
</body>
</html>
